name: sentiric

x-common-settings: &common-settings
  dns:
    - ${DISCOVERY_SERVICE_IPV4_ADDRESS:-10.88.5.1}
    - ${PRIMARY_DNS:-8.8.8.8}
    - ${SECONDARY_DNS:-1.1.1.1}
  dns_search:
    - ${DISCOVERY_DNS_SEARCH_DOMAIN:-service.sentiric.cloud}
  restart: always

networks:
  sentiric-net:
    driver: bridge
    name: sentiric-net
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-10.88.0.0/16}
          gateway: ${NETWORK_GATEWAY:-10.88.0.1}

# volumes:

services:

  proxy-service:
    <<: *common-settings

    image: ghcr.io/sentiric/sentiric-proxy-service:${TAG:-latest}

    build:
      context: ../sentiric-proxy-service
      dockerfile: Dockerfile

    environment:
      # --- Network
      # IP: 10.88.30.7  =>  Port Bloğu: 1307X
      - PROXY_SERVICE_IPV4_ADDRESS=10.88.30.7
      - PROXY_SERVICE_HTTP_PORT=13070
      - PROXY_SERVICE_GRPC_PORT=13071
      - PROXY_SERVICE_METRICS_PORT=13072
      - PROXY_SERVICE_SIP_PORT=13074
      - PROXY_SERVICE_ADVERTISED_HOST=proxy-service # YENİ: Via başlığı için dışa açık host adı

      #
      - REGISTRAR_SERVICE_TARGET_GRPC_URL=registrar-service:13061
      - B2BUA_SERVICE_TARGET_GRPC_URL=b2bua-service:13081
      - DIALPLAN_SERVICE_TARGET_GRPC_URL=dialplan-service:12021
      - B2BUA_SERVICE_SIP_TARGET=b2bua-service:13084 # YENİ/DÜZELTME: Eksik değişken eklendi

      # --- Security
      - GRPC_TLS_CA_PATH=/sentiric-certificates/certs/ca.crt
      - PROXY_SERVICE_CERT_PATH=/sentiric-certificates/certs/proxy-service-chain.crt
      - PROXY_SERVICE_KEY_PATH=/sentiric-certificates/certs/proxy-service.key

    volumes:
      - "${CERTIFICATES_REPO_PATH}:/sentiric-certificates:ro"

    networks:
      sentiric-net:
        ipv4_address: ${PROXY_SERVICE_IPV4_ADDRESS:-10.88.30.7}

    ports:
      - "${PROXY_SERVICE_HTTP_PORT:-13070}:${PROXY_SERVICE_HTTP_PORT:-13070}"
      - "${PROXY_SERVICE_GRPC_PORT:-13071}:${PROXY_SERVICE_GRPC_PORT:-13071}"
      - "${PROXY_SERVICE_METRICS_PORT:-13072}:${PROXY_SERVICE_METRICS_PORT:-13072}"
      
      - "${PROXY_SERVICE_SIP_PORT:-13074}:${PROXY_SERVICE_SIP_PORT:-13074}/udp"
      - "${PROXY_SERVICE_SIP_PORT:-13074}:${PROXY_SERVICE_SIP_PORT:-13074}/tcp" 

    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "${PROXY_SERVICE_GRPC_PORT:-13071}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      
    # depends_on:
    #   # Uygulama Servisleri -> Sadece 'started' olmaları yeterli    
    #   registrar-service: { condition: service_started }
    #   b2bua-service: { condition: service_started }
    #   dialplan-service: { condition: service_started }